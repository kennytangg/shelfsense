[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shelfsense"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
 "fastapi==0.121.3", "uvicorn==0.38.0", "pydantic==2.12.4",
 "SQLAlchemy==2.0.44", "psycopg[binary]==3.2.12", "alembic==1.17.2",
 "opencv-python-headless==4.12.0.88", "numpy==2.2.6", "Pillow==12.0.0",
 "python-multipart==0.0.20", "python-dotenv==1.2.1"
]
[project.optional-dependencies]
dev = ["pytest==9.0.1", "httpx==0.28.1", "playwright==1.56.0", "ruff==0.14.6"]
[project.scripts]
shelfsense = "shelfsense.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
